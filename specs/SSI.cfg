\* SSI.cfg - TLC Configuration for SSI Model Checking
\*
\* Run with: java -jar specs/tla2tools.jar -config specs/SSI.cfg specs/SSI.tla -workers auto
\*
\* Model size: 2 keys, 3 transactions, 2 values
\* This is large enough to exhibit SSI dangerous structures (requires 3 txns for pivot scenarios)
\* Expected state space: ~10M+ states, runtime in minutes

\* Disable deadlock checking - terminal states are valid
CHECK_DEADLOCK FALSE

CONSTANTS
    Keys = {k1, k2}
    Txns = {t1, t2, t3}
    Values = {v1, v2}
    InitialValue = v1
    TXN_PENDING = "pending"
    TXN_ACTIVE = "active"
    TXN_COMMITTED = "committed"
    TXN_ABORTED = "aborted"

\* Specification to check
SPECIFICATION Spec

\* Invariants to verify
INVARIANT TypeOK
INVARIANT WriteWriteIsolation
INVARIANT NoTimeTravel
INVARIANT SSICorrectness

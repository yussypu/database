\* MVCC.cfg - TLC Configuration for Snapshot Isolation Model Checking
\*
\* Run with: tlc MVCC.tla -config MVCC.cfg
\* Or: tlc -workers 4 MVCC.tla -config MVCC.cfg

\* Disable deadlock checking - terminal states (all txns committed/aborted) are valid
CHECK_DEADLOCK FALSE

\* Model values for constants
\* Keep these small for tractable state space exploration
CONSTANTS
    Keys = {k1, k2}
    Txns = {t1, t2, t3}
    Values = {v1, v2}
    InitialValue = v1
    TXN_PENDING = "pending"
    TXN_ACTIVE = "active"
    TXN_COMMITTED = "committed"
    TXN_ABORTED = "aborted"

\* Specification to check
SPECIFICATION Spec

\* Invariants to verify
INVARIANT TypeOK
INVARIANT WriteWriteIsolation
INVARIANT MonotonicVersions
INVARIANT NoTimeTravel
INVARIANT CommitAfterBegin

\* Temporal properties (optional, can be slow)
\* Uncomment to check liveness properties
\* PROPERTY AllTransactionsComplete

\* MVCC-small.cfg - Small model for quick verification
\*
\* Run with: tlc MVCC.tla -config MVCC-small.cfg

\* Disable deadlock checking - terminal states (all txns committed/aborted) are valid
CHECK_DEADLOCK FALSE

\* Small model for fast verification
CONSTANTS
    Keys = {k1}
    Txns = {t1, t2}
    Values = {v1, v2}
    InitialValue = v1
    TXN_PENDING = "pending"
    TXN_ACTIVE = "active"
    TXN_COMMITTED = "committed"
    TXN_ABORTED = "aborted"

\* Specification to check
SPECIFICATION Spec

\* Invariants to verify
INVARIANT TypeOK
INVARIANT WriteWriteIsolation
INVARIANT MonotonicVersions
INVARIANT NoTimeTravel
INVARIANT CommitAfterBegin

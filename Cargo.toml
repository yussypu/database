[workspace]
resolver = "2"
members = [
    "crates/runtime",
    "crates/storage",
    "crates/learned",
    "crates/mvcc",
    "crates/kv",
    "crates/sim",
    "crates/cli",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/cracked-db"

[workspace.dependencies]
# Internal crates
runtime = { path = "crates/runtime" }
storage = { path = "crates/storage" }
learned = { path = "crates/learned" }
mvcc = { path = "crates/mvcc" }
kv = { path = "crates/kv" }
sim = { path = "crates/sim" }

# External dependencies
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
crossbeam-skiplist = "0.1"
crossbeam-utils = "0.8"
crc32c = "0.6"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
bytes = "1.5"

[profile.release]
lto = true
codegen-units = 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.75

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check forbidden imports
        run: |
          chmod +x scripts/check-forbidden-imports.sh
          ./scripts/check-forbidden-imports.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.75

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all

  # Determinism verification - run the same seed multiple times
  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.75

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run determinism acceptance test (1000 iterations)
        run: cargo test --release --package runtime determinism_acceptance_1000_iterations -- --ignored --nocapture

      - name: Run other deterministic tests
        run: cargo test --package runtime deterministic -- --nocapture

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  # TLA+ model checking - verifies SSI algorithm correctness
  spec-check:
    name: TLA+ Spec Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run TLC on SSI.tla
        run: |
          java -XX:+UseParallelGC -Xmx4g -jar specs/tla2tools.jar \
            -config specs/SSI.cfg specs/SSI.tla -workers auto
        timeout-minutes: 45

  # Simulation tests with fault injection
  simulation:
    name: Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.75

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fault scenario acceptance tests
        run: cargo test --release --package sim acceptance -- --nocapture

      - name: Run thorough fault scenario validation (10 seeds)
        run: cargo test --release --package sim acceptance_thorough_validation_10_seeds -- --ignored --nocapture

      - name: Run full scenario sweep (5 seeds)
        run: cargo test --release --package sim acceptance_all_scenarios_5_seeds -- --ignored --nocapture

      - name: Run shrinker acceptance tests
        run: cargo test --release --package sim failure::tests::acceptance -- --nocapture

      - name: Run thorough shrinker validation (10 seeds)
        run: cargo test --release --package sim acceptance_shrinker_thorough_10_seeds -- --ignored --nocapture

  demo:
    name: CLI Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.75

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run CLI demo
        run: |
          cargo run --release --bin crackeddb -- sim demo
        timeout-minutes: 1

      - name: Run CLI tests
        run: cargo test --release --package cli
